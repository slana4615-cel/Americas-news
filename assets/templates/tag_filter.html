<div class="tag-filter-container">
    <div class="tag-filter-header">
        <div>
            <span class="filter-label">🏷️ 主题筛选</span>
            <button class="filter-toggle-btn" onclick="toggleTagFilter()">
                <span class="toggle-text"></span>
                <span class="toggle-icon">▼</span>
            </button>
        </div>
        <div class="filter-status" id="filterStatus" style="display: none;">
            <span class="filter-status-text" id="filterStatusText"></span>
            <button class="filter-clear-btn" onclick="clearTagFilter()" title="清除筛选">
                ✕ 清除
            </button>
        </div>
    </div>
    <div class="tag-filter-bar collapsed" id="tagFilterBar">
        <div class="tag-filter-section">
            <div class="section-label">主要议题</div>
            <button class="tag-filter-btn active" data-tag="all">全部 ({{total_count}})</button>
            <button class="tag-filter-btn" data-tag="民主治理">民主治理</button>
            <button class="tag-filter-btn" data-tag="安全">安全</button>
            <button class="tag-filter-btn" data-tag="经济">经济</button>
            <button class="tag-filter-btn" data-tag="移民">移民</button>
        </div>
        <div class="tag-filter-section">
            <div class="section-label">政策领域</div>
            <button class="tag-filter-btn" data-tag="气候环境">气候环境</button>
            <button class="tag-filter-btn" data-tag="人权">人权</button>
            <button class="tag-filter-btn" data-tag="区域关系">区域关系</button>
            <button class="tag-filter-btn" data-tag="研究资料">研究资料</button>
            <button class="tag-filter-btn" data-tag="其他">其他</button>
        </div>
    </div>
</div>
